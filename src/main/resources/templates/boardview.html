<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>게시글 보기</title>

    <style>
        body {
            background-color: #f5f6f8;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #fafafa;
            padding: 15px;
            min-height: 200px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .btn-area {
            margin-top: 20px;
            text-align: right;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        /* 수정 버튼 */
        .btn-modify {
            background-color: #1976d2;
        }

        .btn-modify:hover {
            background-color: #125ea3;
        }

        /* 파일 보기 버튼 */
        .btn-view {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .btn-view:hover {
            background-color: #d2e3fc;
        }

        /* 다운로드 버튼 */
        .btn-download {
            background-color: #e6f4ea;
            color: #2e7d32;
        }

        .btn-download:hover {
            background-color: #ceead6;
        }

        /* 삭제 버튼 */
        .btn-delete {
            background-color: #e53935;
        }

        .btn-delete:hover {
            background-color: #c62828;
        }

        .field {
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        /* 첨부파일 행 */
        .file-row {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #fff;
            font-size: 13px;
        }

        .file-row .file-icon {
            color: #888;
            font-size: 16px;
            flex-shrink: 0;
        }

        .file-row .filename {
            flex: 1;
            color: #1976d2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-row .no-file {
            flex: 1;
            color: #aaa;
        }

        /* 보기/다운로드 버튼 영역 */
        .file-buttons {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* 아이콘 버튼 */
        .file-buttons .btn {
            width: 26px;
            height: 26px;
            padding: 0;
            font-size: 13px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="form-card">
            <div class="title" th:text="${board.title}">제목</div>
            <div class="content" th:text="${board.content}">내용</div>
            <div class="field">
                <label>첨부파일</label>
                <div class="file-row" th:if="${files.isEmpty()}">
                    <i class="bi bi-folder file-icon"></i>
                    <span class="no-file">첨부된 파일 없음</span>
                </div>
                <div class="file-row" th:each="file : ${files}">
                    <i class="bi bi-folder file-icon"></i>
                    <span class="filename" th:text="${file.originalFilename}">파일명</span>
                    <span class="file-buttons">
                        <a class="btn btn-view"
                           th:href="@{${file.filepath}}"
                           target="_blank"
                           title="파일 보기">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a class="btn btn-download"
                           th:href="@{/board/download/{id}(id=${file.fileId})}"
                           title="파일 다운로드">
                            <i class="bi bi-download"></i>
                        </a>
                    </span>
                </div>
            </div>

            <div class="btn-area">
                <a class="btn btn-modify"
                   th:href="@{/board/modify/{boardId}(boardId=${board.boardId})}">
                    수정
                </a>
                <a class="btn btn-delete"
                   th:href="@{/board/delete(boardId=${board.boardId})}">
                    삭제
                </a>
            </div>
        </div>
    </div>
</body>
</html>
