<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>게시글 보기</title>

    <style>
        body {
            background-color: #f5f6f8;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background-color: #fafafa;
            padding: 15px;
            min-height: 200px;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .btn-area {
            margin-top: 20px;
            text-align: right;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        /* 수정 버튼 */
        .btn-modify {
            background-color: #1976d2;
        }

        .btn-modify:hover {
            background-color: #125ea3;
        }

        /* 파일 보기 버튼 */
        .btn-view {
            background-color: #546e7a;
        }

        .btn-view:hover {
            background-color: #37474f;
        }

        /* 다운로드 버튼 */
        .btn-download {
            background-color: #43a047;
        }

        .btn-download:hover {
            background-color: #2e7d32;
        }

        /* 삭제 버튼 */
        .btn-delete {
            background-color: #e53935;
        }

        .btn-delete:hover {
            background-color: #c62828;
        }

        .field {
            margin-top: 18px;
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        /* 현재 파일 영역 */
        .current-file {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #777;
            margin-top: 0;
            margin-bottom: 8px;
        }

        /* 파일명 */
        .current-file .filename {
            color: #1976d2;
        }

        /* 보기/다운로드 버튼 영역 */
        .file-buttons {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 4px;
        }

        /* 아이콘 버튼 */
        .file-buttons .btn {
            width: 28px;
            height: 28px;
            padding: 0;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="layout">
        <div class="form-card">
            <div class="title" th:text="${board.title}">제목</div>
            <div class="content" th:text="${board.content}">내용</div>
            <div class="btn-area">
                <a class="btn btn-modify"
                   th:href="@{/board/modify/{id}(id=${board.id})}">
                    수정
                </a>
                <a class="btn btn-delete"
                   th:href="@{/board/delete(id=${board.id})}">
                    삭제
                </a>
            </div>
        </div>
    </div>
</body>
</html>
