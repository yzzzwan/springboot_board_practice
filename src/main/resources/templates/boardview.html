<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 보기</title>
    <style>
        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 200px;
        }

        .btn-area {
            margin-top: 15px;
            text-align: right;
        }

        .btn-delete {
            padding: 8px 16px;
            background-color: #e53935;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-delete:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="title" th:text="${board.title}">제목</div>
        <div class="content" th:text="${board.content}">내용</div>
        <div class="btn-area">
            <button class="btn-delete"><a th:href="@{/board/update(id=${board.id})}">저장</a></button>
            <button class="btn-delete"><a th:href="@{/board/delete(id=${board.id})}">삭제</a></button>
        </div>
    </div>
</body>
</html>
