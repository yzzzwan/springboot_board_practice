<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 보기</title>
    <style>
        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .content {
            border: 1px solid #ccc;
            padding: 15px;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="title" th:text="${board.title}">제목</div>
        <div class="content" th:text="${board.content}">내용</div>
    </div>
</body>
</html>
