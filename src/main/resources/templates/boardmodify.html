<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시물 수정폼</title>

    <style>
        body {
            background-color: #f5f6f8;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .form-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #1976d2;
        }

        textarea {
            height: 200px;
            resize: vertical;
        }

        .current-file {
            font-size: 13px;
            color: #777;
            margin-bottom: 8px;
        }

        .current-file span {
            color: #1976d2;
        }

        .file-upload {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 8px 16px;
            background-color: #eef2f7;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-upload-btn:hover {
            background-color: #e2e8f0;
        }

        .file-name {
            font-size: 13px;
            color: #777;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-area {
            margin-top: 24px;
            text-align: right;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            color: white;
            background-color: #1976d2;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #125ea3;
        }
    </style>
</head>

<body>
<div class="layout">
    <div class="form-card">
        <div class="form-title">게시글 수정</div>
        <form th:action="@{/board/update/{id}(id=${board.id})}" method="post" enctype="multipart/form-data">
            <div class="field">
                <label>제목</label>
                <input name="title" type="text" placeholder="제목을 입력하세요" th:value="${board.title}">
            </div>

            <div class="field">
                <label>내용</label>
                <textarea name="content" placeholder="내용을 입력하세요" th:text="${board.content}"></textarea>
            </div>

            <div class="field">
                <label>첨부파일</label>
                <p class="current-file" th:if="${!#strings.isEmpty(#strings.trim(board.filename))}">
                    현재 파일: <span th:text="${board.original_filename}"></span>
                </p>
                <div class="file-upload">
                    <label class="file-upload-btn" for="file">파일 선택</label>
                    <span class="file-name" id="fileName">선택된 파일 없음</span>
                    <input type="file" id="file" name="file"
                           onchange="document.getElementById('fileName').textContent = this.files.length ? this.files[0].name : '선택된 파일 없음'">
                </div>
            </div>

            <div class="btn-area">
                <button class="btn" type="submit">수정</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
