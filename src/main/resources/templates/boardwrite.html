<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시물 작성폼</title>

    <style>
        div {
            width: 500px;
            margin: 50px auto;
        }

        input, textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
        }

        textarea {
            height: 200px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>
<div>
    <input type="text" placeholder="제목">
    <textarea placeholder="내용"></textarea>
    <button>작성</button>
</div>
</body>
</html>
