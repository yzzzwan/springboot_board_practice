<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시물 작성폼</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f6f8;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .layout {
            width: 500px;
            margin: 50px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .form-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #1976d2;
        }

        textarea {
            height: 200px;
            resize: vertical;
        }

        .file-upload {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .file-upload input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 5px 12px;
            background-color: #eef2f7;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #333;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-upload-btn:hover {
            background-color: #e2e8f0;
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #fff;
            font-size: 13px;
        }

        .file-row .file-icon {
            color: #888;
            font-size: 16px;
            flex-shrink: 0;
        }

        .file-row .file-name {
            flex: 1;
            color: #1976d2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .no-file {
            font-size: 13px;
            color: #aaa;
        }

        .file-remove-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0;
        }

        .file-remove-btn:hover {
            background-color: #fee2e2;
            border-color: #f87171;
            color: #ef4444;
        }

        .btn-area {
            margin-top: 24px;
            text-align: right;
        }

        .btn {
            display: inline-block;
            padding: 10px 24px;
            color: white;
            background-color: #1976d2;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #125ea3;
        }
    </style>
</head>

<body>
<div class="layout">
    <div class="form-card">
        <div class="form-title">게시글 작성</div>
        <form action="/board/writepro" method="post" enctype="multipart/form-data">
            <div class="field">
                <label>제목</label>
                <input name="title" type="text" placeholder="제목을 입력하세요">
            </div>

            <div class="field">
                <label>내용</label>
                <textarea name="content" placeholder="내용을 입력하세요"></textarea>
            </div>

            <div class="field">
                <label>첨부파일</label>
                <div class="file-upload">
                    <label class="file-upload-btn" for="file">파일 선택</label>
                    <input type="file" id="file" name="files" multiple
                           onchange="addFileCard(this.files)">
                </div>
                <div class="file-list" id="fileList">
                    <span class="no-file">선택된 파일 없음</span>
                </div>
            </div>

            <div class="btn-area">
                <button class="btn" type="submit">작성</button>
            </div>
        </form>
    </div>
</div>
<script>
    var fileList = [];

    function renderFileCards(files) {
        var list = document.getElementById('fileList');

        if (!files.length) {
            list.innerHTML = '<span class="no-file">선택된 파일 없음</span>';
            return;
        }

        list.innerHTML = fileList.map(function(f) {
            return `
            <div class="file-row file-${f.num}">
                <i class="bi bi-folder file-icon"></i>
                <span class="file-name">${f.name}</span>
                <button type="button"
                        class="file-remove-btn"
                        onclick="deleteFileCard(${f.num})">
                    <i class="bi bi-dash"></i>
                </button>
            </div>
        `;
        }).join('');
    }


    function syncInput() {
        var dt = new DataTransfer();
        fileList.forEach(function(f) { dt.items.add(f); });
        document.getElementById('file').files = dt.files;
    }

    function addFileCard(files) {
        if (!files.length) {
            renderFileCards([]);
            return;
        }

        Array.from(files).forEach(function(f) {
            f.num = fileList.length;
            fileList.push(f);
        });

        renderFileCards(fileList);
        syncInput();
    }

    function deleteFileCard(deleteFileNum) {
        fileList = fileList.filter(function(f) {
            return f.num != deleteFileNum;
        });

        renderFileCards(fileList);
        syncInput();
    }

</script>
</body>
</html>
