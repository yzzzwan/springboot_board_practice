<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 리스트 페이지</title>

    <style>
        body {
            background-color: #f5f6f8;
            font-family: 'Malgun Gothic', sans-serif;
        }

        .layout {
            width: 600px;
            margin: 50px auto;
        }

        .form-card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .list-title {
            font-size: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th:first-child, td:first-child {
            width: 70px;
            text-align: center;
        }

        th {
            background-color: #f5f6f8;
            font-size: 13px;
            color: #555;
        }

        td a {
            color: #333;
            text-decoration: none;
        }

        td a:hover {
            color: #1976d2;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-modify {
            background-color: #1976d2;
        }

        .btn-modify:hover {
            background-color: #125ea3;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 24px 0;
        }

        .pagination a, .pagination strong {
            display: inline-block;
            min-width: 30px;
            padding: 6px 8px;
            text-align: center;
            border-radius: 4px;
            font-size: 13px;
            text-decoration: none;
            color: #333;
        }

        .pagination a:hover {
            background-color: #eef2f7;
        }

        .pagination strong {
            background-color: #1976d2;
            color: white;
        }

        .search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .search-form input[type="text"] {
            flex: 1 1 140px;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .search-form input[type="text"]:focus {
            outline: none;
            border-color: #1976d2;
        }

        .search-form button {
            flex: 1 1 100%;
            padding: 10px 20px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }

        .search-form button:hover {
            background-color: #125ea3;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="form-card">

            <div class="list-header">
                <div class="list-title">게시글 목록</div>
                <a class="btn btn-modify" th:href="@{/board/write}">글 작성</a>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>글 번호</th>
                        <th>제목</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="board: ${list}">
                        <td th:text="${board.id}"></td>
                        <td>
                            <a th:text="${board.title}" th:href="@{/board/view(id=${board.id})}"></a>
                        </td> <!-- localhost:8080/board/view?id=1 -->
                    </tr>
                </tbody>
            </table>

            <div class="pagination">
                <th:block th:each="page: ${#numbers.sequence(startPage, endPage)}">
                    <a th:if="${page != nowPage}"
                       th:href="@{/board/list(page=${(page-1)}, searchKeywordTitle = ${searchKeywordTitle}, searchKeywordContent = ${searchKeywordContent}, searchKeywordTotal = ${searchKeywordTotal})}"
                       th:text="${page}"></a>
                    <strong th:if="${page == nowPage}" th:href="@{/board/list(page=${(page-1)})}" th:text="${page}"></strong>
                </th:block>
            </div>

            <form class="search-form" th:action="@{/board/list}" method="get">
                <input
                        type="text"
                        name="searchKeywordTotal"
                        placeholder="통합검색(제목+내용)"
                        th:value="${searchKeywordTotal}">

                <input
                        type="text"
                        name="searchKeywordTitle"
                        placeholder="제목"
                        th:value="${searchKeywordTitle}">
                <input
                        type="text"
                        name="searchKeywordContent"
                        placeholder="내용"
                        th:value="${searchKeywordContent}">
                <button type="submit">검색</button>
            </form>
        </div>
    </div>
</body>
</html>
